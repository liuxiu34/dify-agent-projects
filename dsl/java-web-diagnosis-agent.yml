    - data:
        code: "import re\nimport json\n\ndef main(log_text: str) -> dict:\n    text = log_text or \"\"\n    lines = [line.rstrip() for line in text.splitlines() if line.strip()]\n\n    exception_pattern = re.compile(r\"((?:[a-zA-Z_$][\\w$]*\\.)*(?:[A-Z][\\w$]*(?:Exception|Error)))\\s*:?\\s*(.*)\")\n    frame_pattern = re.compile(r\"^\\s*at\\s+([\\w.$]+)\\(([^:()]+)(?::(\\d+))?\\)\")\n    sql_pattern = re.compile(r\"(?is)\\b(select|insert|update|delete)\\b.+\")\n    http_status_pattern = re.compile(r\"\\bHTTP[/ ]?\\d*(?:\\.\\d)?\\s*(\\d{3})\\b|status(?:_code)?[=: ]+(\\d{3})\", re.I)\n\n    exception_type = \"\"\n    exception_message = \"\"\n    frames = []\n    business_frames = []\n    mapper_files = []\n    sql_snippets = []\n    http_status = \"\"\n\n    for line in lines:\n        if not exception_type:\n            m = exception_pattern.search(line)\n            if m:\n                exception_type = m.group(1)\n                exception_message = (m.group(2) or \"\").strip()\n\n        fm = frame_pattern.match(line)\n        if fm:\n            cls = fm.group(1)\n            file_name = fm.group(2)\n            line_no = fm.group(3) or \"\"\n            frame = {\n                \"class\": cls,\n                \"file\": file_name,\n                \"line\": line_no\n            }\n            frames.append(frame)\n\n            if not cls.startswith((\"java.\", \"javax.\", \"jakarta.\", \"sun.\", \"com.sun.\", \"org.springframework.\", \"org.apache.\", \"com.fasterxml.\")):\n                business_frames.append(frame)\n\n        if \".xml\" in line or \"Mapper\" in line:\n            mapper_files.append(line.strip())\n\n        sm = sql_pattern.search(line)\n        if sm:\n            sql_snippets.append(line.strip())\n\n        hm = http_status_pattern.search(line)\n        if hm and not http_status:\n            http_status = hm.group(1) or hm.group(2) or \"\"\n\n    signal_keywords = []\n    keyword_map = {\n        \"SQL\": [\"SQLSyntaxErrorException\", \"BadSqlGrammarException\", \"Unknown column\", \"SQL:\", \"mapper\"],\n        \"NPE\": [\"NullPointerException\", \"Cannot invoke\", \"because\", \"null\"],\n        \"AUTH\": [\"AccessDeniedException\", \"Forbidden\", \"Unauthorized\", \"401\", \"403\", \"hasRole\"],\n        \"STARTUP\": [\"BeanCreationException\", \"Application failed to start\", \"Could not resolve placeholder\", \"UnsatisfiedDependencyException\"],\n        \"JSON\": [\"JsonParseException\", \"HttpMessageNotReadableException\", \"JSON parse error\"],\n        \"TIMEOUT\": [\"SocketTimeoutException\", \"Read timed out\", \"Connection timed out\", \"timeout\"],\n        \"DB_CONNECTION\": [\"Communications link failure\", \"Connection refused\", \"DataAccessResourceFailureException\"],\n        \"HTTP\": [\"404\", \"405\", \"500\", \"NoHandlerFoundException\"]\n    }\n\n    for category, keywords in keyword_map.items():\n        for keyword in keywords:\n            if keyword.lower() in text.lower():\n                signal_keywords.append(category + \":\" + keyword)\n\n    top_business_frame = business_frames[0] if business_frames else {}\n\n    evidence_count = 0\n    if exception_type:\n        evidence_count += 1\n    if exception_message:\n        evidence_count += 1\n    if top_business_frame:\n        evidence_count += 1\n    if mapper_files:\n        evidence_count += 1\n    if sql_snippets:\n        evidence_count += 1\n    if http_status:\n        evidence_count += 1\n    if signal_keywords:\n        evidence_count += 1\n\n    evidence_score = min(10, evidence_count * 2)\n    evidence_sufficient = \"yes\" if evidence_score >= 4 else \"no\"\n\n    result = {\n        \"exception_type\": exception_type,\n        \"exception_message\": exception_message,\n        \"top_business_frame\": top_business_frame,\n        \"frame_count\": len(frames),\n        \"business_frame_count\": len(business_frames),\n        \"mapper_files\": mapper_files[:5],\n        \"sql_snippets\": sql_snippets[:3],\n        \"http_status\": http_status,\n        \"signal_keywords\": signal_keywords[:12],\n        \"evidence_count\": evidence_count,\n        \"evidence_score\": evidence_score,\n        \"evidence_sufficient\": evidence_sufficient\n    }\n\n    return {\n        \"stack_evidence\": json.dumps(result, ensure_ascii=False, indent=2),\n        \"evidence_sufficient\": evidence_sufficient,\n        \"evidence_score\": evidence_score,\n        \"exception_type\": exception_type or \"UNKNOWN\"\n    }"
        code_language: python3
        outputs:
          evidence_score:
