    - data:
        code: "import re\nimport json\n\ndef main(raw_log: str) -> dict:\n    text = raw_log or \"\"\n    original = text\n\n    rules = [\n        (\"email\", r\"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\", \"[EMAIL]\"),\n        (\"phone\", r\"(?<!\\d)(?:1[3-9]\\d{9}|\\+?\\d[\\d -]{8,}\\d)(?!\\d)\", \"[PHONE]\"),\n        (\"jwt\", r\"eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\", \"[JWT]\"),\n        (\"bearer\", r\"(?i)\\bBearer\\s+[A-Za-z0-9._~+/=-]+\", \"Bearer [TOKEN]\"),\n        (\"authorization\", r\"(?i)(Authorization\\s*[:=]\\s*)(.+)\", r\"\\1[REDACTED]\"),\n        (\"password\", r\"(?i)\\b(password|passwd|pwd|secret|token|api[_-]?key)\\s*[:=]\\s*[^,\\s;&]+\", r\"\\1=[REDACTED]\"),\n        (\"jdbc_password\", r\"(?i)([?&](?:password|pwd)=)[^&\\s]+\", r\"\\1[REDACTED]\"),\n        (\"ipv4\", r\"\\b((?:\\d{1,3}\\.){3})\\d{1,3}\\b\", r\"\\1x\"),\n    ]\n\n    hits = {}\n    for name, pattern, repl in rules:\n        text, count = re.subn(pattern, repl, text)\n        if count:\n            hits[name] = count\n\n    text = re.sub(r\"\\n{4,}\", \"\\n\\n\\n\", text).strip()\n\n    summary = {\n        \"redacted_types\": hits,\n        \"changed\": text != original,\n        \"raw_length\": len(original),\n        \"sanitized_length\": len(text),\n        \"line_count\": len(text.splitlines()) if text else 0\n    }\n\n    return {\n        \"sanitized_log\": text,\n        \"redaction_summary\": json.dumps(summary, ensure_ascii=False),\n        \"raw_length\": len(original),\n        \"line_count\": len(text.splitlines()) if text else 0\n    }"
        code_language: python3
        outputs:
