    - data:
        code: "import json\nimport re\n\ndef _conflict_reason(text: str) -> str:\n    # 2026-09-05 修复(TC09)：日志混排/证据冲突时路由 OTHER 通用兜底，不按首个关键词硬分\n    reqs = re.findall(r\"REQUESTID[=:\\s]+([A-Z0-9_-]+)\", text)\n    if len(set(reqs)) > 1:\n        return \"multiple requestId: \" + \",\".join(sorted(set(reqs)))\n    if reqs and \" ERROR \" in text and re.search(r\"ERROR[^\\n]*\\n[^\\n]*(200 OK|COMPLETED)\", text):\n        return \"same requestId has both ERROR and success\"\n    return \"\"\n\ndef main(log_text: str, stack_evidence: str = \"\") -> dict:\n    text = ((log_text or \"\") + \"\\n\" + (stack_evidence or \"\")).upper()\n\n    error_type = \"OTHER\"\n    evidence = []\n\n    conflict = _conflict_reason(text)\n    if conflict:\n        evidence = [\"evidence conflict: \" + conflict]\n        return {\n            \"error_type\": \"OTHER\",\n            \"route_key\": \"OTHER\",\n            \"classification_json\": json.dumps({\n                \"error_type\": \"OTHER\", \"confidence\": 0.5, \"evidence\": evidence,\n                \"note\": \"日志疑似混排多个请求或状态矛盾，请提供单一故障的完整日志\"\n            }, ensure_ascii=False),\n            \"confidence\": \"0.5\",\n        }\n\n    rules = [\n        (\"SQL\", [\"SQLSYNTAXERROREXCEPTION\", \"BADSQLGRAMMAREXCEPTION\", \"UNKNOWN COLUMN\", \" SQL:\"]),\n        (\"NPE\", [\"NULLPOINTEREXCEPTION\", \"BECAUSE\", \" IS NULL\"]),\n        (\"AUTH\", [\"ACCESSDENIEDEXCEPTION\", \"HTTP STATUS: 403\", \"HASROLE\", \"AUTHORITIES\"]),\n        (\"STARTUP\", [\"APPLICATION RUN FAILED\", \"BEANCREATIONEXCEPTION\", \"COULD NOT RESOLVE PLACEHOLDER\", \"UNSATISFIEDDEPENDENCYEXCEPTION\"]),\n        (\"JSON\", [\"JSONPARSEEXCEPTION\", \"HTTPMESSAGENOTREADABLEEXCEPTION\", \"JSON PARSE ERROR\"]),\n        (\"TIMEOUT\", [\"SOCKETTIMEOUTEXCEPTION\", \"READ TIMED OUT\", \"CONNECTION TIMED OUT\"]),\n        (\"DB_CONNECTION\", [\"COMMUNICATIONS LINK FAILURE\", \"CONNECTION REFUSED\"]),\n        (\"ILLEGAL_ARGUMENT\", [\"ILLEGALARGUMENTEXCEPTION\"]),\n    ]\n\n    for category, keywords in rules:\n        hit = [k for k in keywords if k in text]\n        if hit:\n            error_type = category\n            evidence = hit[:5]\n            break\n\n    confidence = 0.95 if error_type != \"OTHER\" else 0.1\n\n    classification = {\n        \"error_type\": error_type,\n        \"confidence\": confidence,\n        \"evidence\": evidence\n    }\n\n    return {\n        \"error_type\": error_type,\n        \"route_key\": error_type,\n        \"classification_json\": json.dumps(classification, ensure_ascii=False),\n        \"confidence\": str(confidence)\n    }"
        code_language: python3
