    - data:
        code: |
          import json, re

          FIELD_HINTS = {
              "name": ("员工姓名", "员工：张三"),
              "city": ("出差城市/城市等级", "出差城市：上海"),
              "items": ("费用明细（≥1条，含金额）", "住宿 500元/晚，2晚"),
              "trip_or_total": ("行程日期 或 合计金额", "出差日期：2026-08-01 至 2026-08-03（或 合计 1853 元）"),
          }

          SMALLTALK_WORDS = ["你好","您好","hello","hi","嗨","你是谁","你是","在吗","在么","谢谢","感谢",
                             "介绍","你能做什么","你会什么","怎么用","帮忙","测试","哈喽","halo"]

          def _is_smalltalk(t):
              """非收集状态下：打招呼/无关注入识别（不含任何报销特征词才算闲聊）。"""
              t = _norm(t)
              if not t:
                  return True
              if re.search(r"员工|报销|出差|住宿|酒店|发票|水单|交通|餐补|高铁|动车|机票|打车|航班|城市|合计|金额|号码|日期|元|\d", t):
                  return False
              return any(g in t for g in SMALLTALK_WORDS)

          CITY_TIER = {"上海":"一线城市","北京":"一线城市","广州":"一线城市","深圳":"一线城市",
                       "成都":"新一线","杭州":"新一线","重庆":"新一线","苏州":"新一线","武汉":"新一线","南京":"新一线"}

          def _norm(s):
              if s is None: return ""
              return str(s).strip()

          def _extract_from_text(text):
              t = _norm(text); m = {"name":"","grade":"","exp_type":"","city_level":"","dept":"",
                   "trip_start":"","trip_end":"","total_amount":0.0,
                   "invoice":{},"items":[],"note":""}
              r = re.search(r"(?:员工|报销人)\s*[:：]?\s*([\u4e00-\u9fa5A-Za-z]{2,5})", t)
              if r: m["name"] = r.group(1)
              for g in ("普通员工","副总裁","副总经理","副总","总经理","副总监","总监","高级经理","经理","主管","财务","部门负责人"):
                  if g in t:
                      m["grade"] = g; break
              r = re.search(r"(?:报销类型|费用类型|类型)\s*[:：]?\s*(住宿|交通|餐饮|餐补|其他)", t)
              if r:
                  m["exp_type"] = r.group(1)
              r = re.search(r"(?:出差城市|城市|目的地)\s*[:：]?\s*([\u4e00-\u9fa5]{2,5})", t)
              if r:
                  m["city_level"] = r.group(1)
              else:
                  for c, lv in CITY_TIER.items():
                      if c in t:
                          m["city_level"] = lv; break
              r = re.search(r"(\d{4}-\d{2}-\d{2})\s*至\s*(\d{4}-\d{2}-\d{2})", t)
              if r: m["trip_start"], m["trip_end"] = r.group(1), r.group(2)
              r = re.search(r"(?:合计|总额)\s*[:：]?\s*(\d+(?:\.\d+)?)", t)
              if r: m["total_amount"] = float(r.group(1))
              inv = m["invoice"]
              r = re.search(r"发票[:：]?\s*([\u4e00-\u9fa5A-Za-z（()）\-\d]{2,30}?(?:有限公司|酒店|公司|集团|商行|商城|超市))", t)
              if r: inv["seller"] = r.group(1)
              r = re.search(r"号码[:：]?\s*(\d{18,22})", t)
              if r: inv["no"] = r.group(1)
              r = re.search(r"金额[:：]?\s*(\d+(?:\.\d+)?)", t)
              if r: inv["amount"] = float(r.group(1))
              if "无发票" in t or "发票丢失" in t or "没发票" in t: m["note"] = "无发票"
              r = re.search(r"住宿\s*(\d+)\s*元\s*[/每]\s*晚[^,\n]*?[，,]\s*(\d+)\s*晚", t)
              if r:
                  up, n = int(r.group(1)), int(r.group(2))
                  m["items"].append({"category":"hotel","unit_price":float(up),"nights":n,
                                     "amount":float(up*n),
                                     "invoice_count":1 if "有发票" in t or "水单" in t else 0,
                                     "folio":1 if "水单" in t else 0})
              ic_flag = 1 if ("有发票" in t or "水单" in t or "发票：" in t or "发票:" in t) else 0
              r = re.search(r"高铁\s*(一等座|二等座|商务座)?\s*(\d+)\s*元", t)
              if r:
                  m["items"].append({"category":"transport","name":"高铁","seat_class":r.group(1) or "二等座",
                                     "amount":float(r.group(2)),
                                     "invoice_count":ic_flag,"folio":0})
              r = re.search(r"(?:机票|飞机)\s*(经济舱|商务舱)?\s*(\d+)\s*元", t)
              if r:
                  m["items"].append({"category":"transport","name":"机票",
                                     "cabin":r.group(1) or "经济舱","flight":float(r.group(2)),
                                     "invoice_count":ic_flag,"folio":0})
              r = re.search(r"打车\s*(\d+)\s*元", t)
              if r:
                  m["items"].append({"category":"transport","name":"打车","amount":float(r.group(1)),
                                     "invoice_count":ic_flag,"folio":0})
              return m

          def _items_total(m):
              items = m.get("items") or []
              if not isinstance(items, list): return 0.0
              s = 0.0
              for it in items:
                  if isinstance(it, dict):
                      try: s += float(it.get("amount") or 0)
                      except Exception: pass
              return round(s, 2)

          def _get_invoice(m):
              return m.get("invoice") if isinstance(m.get("invoice"), dict) else {}

          def invoice_status(m):
              inv = _get_invoice(m); seller = _norm(inv.get("seller")); no = _norm(inv.get("no"))
              note = _norm(m.get("note"))
              declared = ("无发票" in note) or ("发票丢失" in note) or ("没发票" in note)
              if declared and not no:
                  return "declared_none", ("【发票缺失 · 能否通过说明】你已声明无发票：按报销制度，发票是核销凭证，"
                                           "无发票无法证明消费真实性，该笔报销不能直接通过。"
                                           "若上方分析显示费用标准本身合规，补充发票后即可正常通过；"
                                           "若同时存在超标等异常，即使补票也需按超标流程继续审批。"
                                           "建议：补充对应金额的增值税发票后重新提交；确实无法取得发票的，转财务人工特批。")
              if declared and no: return "conflict", "【信息冲突】你声明没有发票，却又提供了发票号码，前后矛盾，请核实。"
              if seller and no:
                  amt = 0.0
                  try: amt = float(inv.get("amount") or 0)
                  except Exception: pass
                  tot = _items_total(m)
                  if amt > 0 and tot > 0 and abs(amt - tot) > 1.0:
                      return "conflict", ("【信息冲突】发票金额与费用明细合计不一致（发票 %.2f vs 明细合计 %.2f），可能有问题，请核实。" % (amt, tot))
                  return "valid", ""
              if seller or no:
                  return "suspicious", "【发票有效性存疑】发票信息不完整（开票公司与发票号码缺一），无法唯一证明发票真实有效。"
              return "missing", ("【发票有效性存疑】未提供开票公司名称与发票号码，无法证明发票真实有效。该笔报销存在不予通过风险，建议补充后重新提交，或转财务人工核验。")

          def check_completeness(m):
              missing = []
              if not _norm(m.get("name")): missing.append("name")
              if not _norm(m.get("city_level")): missing.append("city")
              items = m.get("items") or []
              if not isinstance(items, list) or len(items) == 0: missing.append("items")
              trip = _norm(m.get("trip_start")) or _norm(m.get("trip_end"))
              total = 0.0
              try: total = float(m.get("total_amount") or 0)
              except Exception: total = 0.0
              if not trip and total <= 0: missing.append("trip_or_total")
              return len(missing) == 0, missing

          def _merge_with_collected(new_m, prev_collected):
              if not isinstance(prev_collected, dict): return new_m
              out = json.loads(json.dumps(prev_collected))
              for k in ("name","city_level","dept","trip_start","trip_end","total_amount","note"):
                  if new_m.get(k): out[k] = new_m[k]
              new_inv = new_m.get("invoice") or {}
              if new_inv:
                  out_inv = out.get("invoice") if isinstance(out.get("invoice"), dict) else {}
                  for k,v in new_inv.items():
                      if v: out_inv[k] = v
                  out["invoice"] = out_inv
              new_items = new_m.get("items") or []
              if new_items: out["items"] = (out.get("items") or []) + new_items
              return out

          def _main_core(raw_text, conv_round=0, conv_status="new", conv_missing_json="[]", conv_invalid=0, conv_collected_json="{}"):
              try: prev = json.loads(conv_collected_json or "{}")
              except Exception: prev = {}
              prev_round = int(conv_round or 0)
              status = conv_status or "new"
              invalid = int(conv_invalid or 0)
              continuing = (status in ("collecting","invalid")) and prev_round >= 1
              extracted = _extract_from_text(raw_text or "")
              # 关键修复：仅当"续补同一单据"时才合并历史证据。
              # 上一单已完成(complete)表示新单据开始，此时不继承上一单的任何信息，
              # 避免把上一个人的城市/明细/发票串到新单上（串单 bug）。
              merged = _merge_with_collected(extracted, prev) if continuing else extracted
              # 报销类型兜底：按明细类别推断（住宿/交通/其他）
              if not merged.get("exp_type"):
                  cats = {it.get("category") for it in (merged.get("items") or []) if isinstance(it, dict)}
                  if "hotel" in cats: merged["exp_type"] = "住宿"
                  elif "transport" in cats: merged["exp_type"] = "交通"
                  elif cats: merged["exp_type"] = "其他"
              complete, missing = check_completeness(merged)
              st, warn = invoice_status(merged)

              if not continuing:
                  if _is_smalltalk(raw_text or ""):
                      return {"reply_text": "你好，我是报销异常预审助手。请按以下顺序发我报销信息：①员工姓名 ②身份（普通员工/经理/总监/副总/总经理，不填默认普通员工）③报销类型（住宿/交通/其他）④出差城市 ⑤行程日期 ⑥费用明细（如 住宿 500元/晚，2晚）⑦发票情况（有发票请写开票公司与发票号码）⑧合计金额。可以一次性发完整单，也可以分多条补充，我会先校验完整性，再按公司制度做合规预审。",
                              "should_diagnose": "否",
                              "new_round": prev_round, "new_status": "new",
                              "new_missing_json": "[]", "new_invalid": 0,
                              "new_collected_json": "{}",
                              "invoice_status": "", "invoice_warning": ""}
                  if complete:
                      return {"reply_text":"","should_diagnose":"是",
                              "new_round":1,"new_status":"complete",
                              "new_missing_json":"[]","new_invalid":0,
                              "new_collected_json":json.dumps(merged, ensure_ascii=False),
                              "invoice_status":st,"invoice_warning":warn}
                  t1 = "【证据不足】\n当前信息无法判断该报销是否合规，暂不下结论。\n缺少以下必要信息，请补充：\n" + \
                       "\n".join("• %s（示例：%s）" % (FIELD_HINTS[f][0], FIELD_HINTS[f][1]) for f in missing) + \
                       "\n\n推荐填写顺序：①员工姓名 ②身份（普通员工/经理/总监/副总/总经理，不填默认普通员工）③报销类型（住宿/交通/其他）④出差城市 ⑤行程日期 ⑥费用明细 ⑦发票情况 ⑧合计金额"
                  return {"reply_text":t1,"should_diagnose":"否",
                          "new_round":1,"new_status":"collecting",
                          "new_missing_json":json.dumps(missing, ensure_ascii=False),"new_invalid":0,
                          "new_collected_json":json.dumps(merged, ensure_ascii=False),
                          "invoice_status":"","invoice_warning":""}

              if invalid >= 3:
                  return {"reply_text":"连续多次补充未通过校验。为避免反复，请直接发送完整报销单文本（员工/城市/行程/明细/发票/合计），或转人工咨询。",
                          "should_diagnose":"否","new_round":prev_round+1,"new_status":"invalid",
                          "new_missing_json":conv_missing_json,"new_invalid":invalid+1,
                          "new_collected_json":json.dumps(merged, ensure_ascii=False),
                          "invoice_status":"","invoice_warning":""}

              try: missing_fields = json.loads(conv_missing_json or "[]")
              except Exception: missing_fields = []

              if complete:
                  if st == "valid":
                      return {"reply_text":"已补全必要信息，开始合规性判断。","should_diagnose":"是",
                              "new_round":prev_round+1,"new_status":"complete",
                              "new_missing_json":"[]","new_invalid":0,
                              "new_collected_json":json.dumps(merged, ensure_ascii=False),
                              "invoice_status":st,"invoice_warning":""}
                  msg = "已收到补充，开始合规性判断。"
                  if st == "conflict":
                      msg = "已收到补充，但检测到信息冲突，开始合规性判断（请留意下方提示）。"
                  return {"reply_text":msg,"should_diagnose":"是",
                          "new_round":prev_round+1,"new_status":"complete",
                          "new_missing_json":"[]","new_invalid":0,
                          "new_collected_json":json.dumps(merged, ensure_ascii=False),
                          "invoice_status":st,"invoice_warning":warn}

              prev_set = set(missing_fields); cur_set = set(missing)
              progressed = cur_set < prev_set
              if not progressed and not (set(FIELD_HINTS) - cur_set):
                  progressed = True
              if not progressed:
                  t2 = "【补充的信息不对】\n未能识别出有效的补充内容。请对照缺失项按模板补充（不要用含糊描述）：\n" + \
                       "\n".join("• %s（示例：%s）" % (FIELD_HINTS[f][0], FIELD_HINTS[f][1]) for f in missing)
                  return {"reply_text":t2,"should_diagnose":"否",
                          "new_round":prev_round+1,"new_status":"invalid",
                          "new_missing_json":json.dumps(missing, ensure_ascii=False),"new_invalid":invalid+1,
                          "new_collected_json":json.dumps(merged, ensure_ascii=False),
                          "invoice_status":"","invoice_warning":""}
              t3 = "已收到补充。" + ("仍需补充：" + "、".join(FIELD_HINTS[f][0] for f in missing) if missing else "") + " 请继续。"
              return {"reply_text":t3,"should_diagnose":"否",
                      "new_round":prev_round+1,"new_status":"collecting",
                      "new_missing_json":json.dumps(missing, ensure_ascii=False),"new_invalid":0,
                      "new_collected_json":json.dumps(merged, ensure_ascii=False),
                      "invoice_status":"","invoice_warning":""}
          def _fmt_json(merged):
              m = merged or {}
              # 2026-09-06 修复（用户反馈）：对齐两套发票数据源——
              # 发票要素齐全（销售方+号码）即视为"有发票"，自动补明细标记，
              # 避免规则引擎按明细 invoice_count=0 误判"明细未附发票"
              _inv = m.get("invoice") if isinstance(m.get("invoice"), dict) else {}
              _has_inv = bool(str(_inv.get("seller") or "").strip()) and bool(str(_inv.get("no") or "").strip())
              _note = str(m.get("note") or "")
              _declared_none = ("无发票" in _note) or ("发票丢失" in _note)
              if _has_inv and not _declared_none:
                  for _it in (m.get("items") or []):
                      if isinstance(_it, dict) and _it.get("category") != "meal" and not _it.get("invoice_count"):
                          _it["invoice_count"] = 1
              CITY_MAP = {"上海":"一线城市","北京":"一线城市","广州":"一线城市","深圳":"一线城市",
                          "成都":"新一线","杭州":"新一线","重庆":"新一线","苏州":"新一线","武汉":"新一线","南京":"新一线",
                          "西安":"新一线","长沙":"新一线","郑州":"新一线","青岛":"新一线","沈阳":"新一线","合肥":"新一线",
                          "宁波":"新一线","东莞":"新一线","佛山":"新一线","天津":"新一线","无锡":"新一线"}
              cl = m.get("city_level") or ""
              if cl not in ("一线城市","新一线","二线城市","三线及以下"):
                  cl = CITY_MAP.get(cl, "二线城市")
              header = {
                  "name": m.get("name") or "",
                  "grade": m.get("grade") or "普通员工",
                  "exp_type": m.get("exp_type") or "",
                  "dept": m.get("dept") or "",
                  "city_level": cl,
                  "trip_start": m.get("trip_start") or "",
                  "trip_end": m.get("trip_end") or "",
                  "submit_date": m.get("submit_date") or "",
                  "total_amount": str(m.get("total_amount") or ""),
                  "note": m.get("note") or "",
                  "pre_approved": False,
              }
              return (
                  json.dumps(header, ensure_ascii=False),
                  json.dumps(m.get("items") or [], ensure_ascii=False),
                  json.dumps(m, ensure_ascii=False),
              )

          def main(raw_text, conv_round=0, conv_status="new", conv_missing_json="[]", conv_invalid=0, conv_collected_json="{}"):
              r = _main_core(raw_text, conv_round, conv_status, conv_missing_json, conv_invalid, conv_collected_json)
              try:
                  merged = json.loads(r.get("new_collected_json") or "{}")
              except Exception:
                  merged = {}
              hj, ij, st = _fmt_json(merged)
              r["header_json"] = hj
              r["items_json"] = ij
              r["sanitized_text"] = st
              try:
                  r["total_amount"] = float(merged.get("total_amount") or 0)
              except Exception:
                  r["total_amount"] = 0.0
              return r
