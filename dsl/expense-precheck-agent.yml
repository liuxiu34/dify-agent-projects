    - data:
        code: |-
          import json, re

          def main(slots_raw: str, over_ratio: str) -> dict:
              slots = {}
              try:
                  slots = json.loads((slots_raw or "").strip())
              except Exception:
                  m = re.search(r"\{.*\}", slots_raw or "", re.S)
                  if m:
                      try:
                          slots = json.loads(m.group(0))
                      except Exception:
                          slots = {}
              sub = slots.get("sub_type", "")
              provided = bool(slots.get("evidence_present", False))

              LIB = {
                  "不可抗力":   {"code": "TRV-EX-01", "title": "不可抗力行程变更/滞留，按实报销不受限额约束",
                                 "evidence": ["承运方取消/延误/停运证明"]},
                  "客户接待":   {"code": "TRV-EX-02", "title": "客户接待/商务宴请，住宿交通上限上浮50%",
                                 "evidence": ["事前指派记录(邮件/OA)", "接待对象单位与人数"]},
                  "紧急任务":   {"code": "TRV-EX-03", "title": "24h内紧急出差，住宿标准上浮30%",
                                 "evidence": ["紧急任务来源说明(工单/事故报告/主管确认)"]},
                  "节假日涨价": {"code": "TRV-EX-04", "title": "节假日出行高峰机票上浮>30%，部门经理确认后按实报",
                                 "evidence": ["同期平日票价对比截图"]},
                  "长住协议":   {"code": "TRV-EX-05", "title": "同城连续>15日且选长住方案，按协议月租价折算",
                                 "evidence": ["长住协议或租赁合同"]},
                  "合住不可行": {"code": "TRV-EX-06", "title": "合住客观不可行，部门经理确认后可单住",
                                 "evidence": ["同行人员信息", "不可合住说明"]},
                  "展会满房":   {"code": "TRV-EX-07", "title": "展会/峰会/赛事期间同城满房，住宿标准上浮30%",
                                 "evidence": ["活动主办方公告或参会邀请函", "酒店满房证明/订房平台截图", "入住酒店与场馆距离说明"]},
                  "超标未说明": {"code": "TRV-APR-02", "title": "超标按公司档位审批",
                                 "evidence": []},
                  "缺发票":     {"code": "TRV-INV-03", "title": "住宿须附发票",
                                 "evidence": ["发票"]},
                  "红线消费":   {"code": "TRV-RED-05", "title": "禁止类消费一律不予报销（整单退回）",
                                 "evidence": []},
              }
              hit = LIB.get(sub, {"code": "TRV-MATCH-NONE", "title": "未匹配到例外条款，需人工核对制度", "evidence": []})
              missing = hit["evidence"] if not provided else []

              try:
                  r = float(over_ratio or 0)
              except Exception:
                  r = 0.0
              if r <= 0:
                  route = "财务部直接核销"
              elif r <= 20:
                  route = "部门经理审批"
              elif r <= 50:
                  route = "分管副总审批"
              else:
                  route = "总经理审批（专项说明 + 事前审批记录 + 财务部书面意见）"
              if hit["code"].startswith("TRV-EX-"):
                  route = f"按例外条款 {hit['code']} 审核后，{route}"

              return {
                  "matched_clause_json": json.dumps({"code": hit["code"], "title": hit["title"]}, ensure_ascii=False),
                  "missing_evidence_json": json.dumps(missing, ensure_ascii=False),
                  "approval_route": route,
                  "over_ratio": str(r),
                  "slots_json": json.dumps(slots, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          approval_route:
            children:
            type: string
          matched_clause_json:
            children:
            type: string
          missing_evidence_json:
            children:
            type: string
          over_ratio:
            children:
            type: string
          slots_json:
            children:
            type: string
