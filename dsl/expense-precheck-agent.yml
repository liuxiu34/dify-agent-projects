    nodes:
    - data:
        selected: false
        title: "用户输入"
        type: start
        variables: []
      height: 73
      id: '1788519253051'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: |-
          import json
          from datetime import datetime

          def main(header_json: str, items_json: str, total_amount: float) -> dict:
              header = json.loads(header_json or "{}")
              items = json.loads(items_json or "[]")
              city = header.get("city_level", "")
              note = (header.get("note") or "").strip()
              grade = header.get("grade", "")
              hits = []

              HOTEL_STD = {"一线城市": 700.0, "新一线": 550.0, "二线城市": 450.0, "三线及以下": 350.0}
              MEAL_STD  = {"一线城市": 120.0, "新一线": 100.0, "二线城市": 80.0, "三线及以下": 60.0}
              TAXI_STD  = {"一线城市": 100.0, "新一线": 80.0, "二线城市": 60.0, "三线及以下": 50.0}
              FORBIDDEN = ["娱乐场所", "洗浴", "高尔夫", "奢侈品", "烟酒"]
              def lim(t): return float(t or 0)

              def add(code, ok, actual, threshold, evidence, level, action):
                  if ok:
                      hits.append({"rule_code": code, "hit": True, "actual": str(actual),
                                   "threshold": str(threshold), "evidence": evidence,
                                   "anomaly_level": level, "action": action})

              # ---- 输入有效性护栏（2026-09-05 修复）：完全无法识别出报销内容时，禁止走合规直通 ----
              has_items = len(items) > 0
              note_text = (str(header.get("note") or "").strip())
              # 2026-09-05 护栏收紧：只有能解析出费用明细、或存在有效异常说明文字时才继续；
              # 仅填员工/城市等个人信息但没有任何可核验内容时，一律判"证据不足"引导补材料，
              # 禁止再走 L0 直通放行（原实现 0 明细但有姓名也会被放行）。
              if not has_items and not note_text and not (float(total_amount or 0) > 0 and len(items) > 0):
                  return {
                      "conclusion": "unrecognized",
                      "level": "L1",
                      "hit_count": 1,
                      "hits_json": json.dumps([{
                          "rule_code": "TRV-FMT-001", "hit": True,
                          "actual": "证据不足", "threshold": ">=1条可核验的费用明细或异常说明",
                          "evidence": "未能识别出可核验的报销内容：缺少费用明细/异常说明。请按模板补齐后重新提交：员工/城市/行程日期/费用明细（如 住宿 500元/晚，2晚，有发票）或异常说明。",
                          "anomaly_level": "L1", "action": "anomaly"
                      }], ensure_ascii=False),
                      "over_ratio": "0.0",
                      "llm_calls": "0",
                      "note": "证据不足：未识别到可核验的费用明细，需补充后重新提交",
                      "header": "",
                      "user_conclusion": "❌ 审核结论：您提交的信息还不足以判断该报销是否合规，请先按提示补充所需材料。",
                  }

              trip_days = 0
              try:
                  d0 = datetime.strptime(header.get("trip_start", ""), "%Y-%m-%d")
                  d1 = datetime.strptime(header.get("trip_end", ""), "%Y-%m-%d")
                  trip_days = (d1 - d0).days + 1
              except Exception:
                  trip_days = 0

              try:
                  d1 = datetime.strptime(header.get("trip_end", ""), "%Y-%m-%d")
                  ds = datetime.strptime(header.get("submit_date", ""), "%Y-%m-%d")
                  gap = (ds - d1).days
                  add("TRV-INV-005", gap > 30, gap, 30, f"提交距行程结束 {gap} 日，超 30 日时限", "L1", "anomaly")
              except Exception:
                  pass

              for it in items:
                  cat = it.get("category", "")
                  blob = cat + "|" + str(it.get("name", "")) + "|" + str(it.get("reason", ""))
                  for w in FORBIDDEN:
                      if w in blob:
                          add("TRV-RED-005", True, w, "禁止清单", "明细命中禁止报销项：" + w, "L2", "reject")

                  if cat == "hotel":
                      up = lim(it.get("unit_price"))
                      st = HOTEL_STD.get(city, 450.0)
                      add("TRV-ACC-001", up > st, up, st, f"住宿单价 {up} 元/晚，{city}标准 {st} 元/晚", "L1", "anomaly")
                      if trip_days and lim(it.get("nights")) > trip_days:
                          add("TRV-ACC-002", True, it.get("nights"), trip_days, "住宿夜数超过出差天数", "L1", "anomaly")

                  if cat == "transport":
                      seat = it.get("seat_class", "")
                      if seat in ("一等座", "商务座"):
                          mgr_ok = any(g in grade for g in ["总监", "副总裁", "副总", "总经理"])
                          if seat == "一等座" and not mgr_ok:
                              add("TRV-TRA-001", True, seat, "二等座/总监及以上一等座", "席别超标且无对应职级", "L1", "anomaly")
                          if seat == "商务座":
                              add("TRV-TRA-001", True, seat, "商务座需副总批准", "商务座未提供批准依据", "L2", "anomaly")
                      cabin = it.get("cabin", "")
                      if cabin == "商务舱":
                          add("TRV-TRA-002", True, cabin, "经济舱", "商务舱需提前3工作日专项申请", "L2", "anomaly")
                      if it.get("flight") and lim(it.get("discount", 1)) < 0.6:
                          d = lim(it.get("discount", 1))
                          add("TRV-TRA-003", True, d, 0.6, f"机票折扣 {d} 低于 6 折", "L1", "anomaly")
                      if it.get("name") in ("打车", "市内交通", "出租车", "网约车"):
                          if it.get("days") and lim(it.get("daily_amount")) > TAXI_STD.get(city, 60.0):
                              st2 = TAXI_STD.get(city, 60.0)
                              add("TRV-TRA-004", True, it.get("daily_amount"), st2,
                                  f"市内交通 {it.get('daily_amount')} 元/天，{city}限额 {st2} 元", "L1", "anomaly")
                          if lim(it.get("amount")) > 200:
                              add("TRV-TRA-101", True, it.get("amount"), 200, "单笔市内交通超 200 元需说明事由", "L1", "warn")
                      if it.get("name") == "自驾" and lim(it.get("mileage_rate")) > 0.8:
                          add("TRV-TRA-005", True, it.get("mileage_rate"), 0.8, "自驾单价超 0.8 元/公里", "L1", "anomaly")

                  if cat == "meal":
                      if lim(it.get("daily_amount")) > MEAL_STD.get(city, 80.0):
                          st3 = MEAL_STD.get(city, 80.0)
                          add("TRV-MEA-001", True, it.get("daily_amount"), st3,
                              f"餐补 {it.get('daily_amount')} 元/天，{city}标准 {st3} 元/天", "L1", "anomaly")

                  ic = it.get("invoice_count", 1)
                  ic = 1 if ic is None else int(ic or 0)   # 注意不能用 (ic or 1)：显式 0（无发票）会被误当成 1
                  if cat != "meal" and ic < 1:
                      add("TRV-INV-003", True, 0, 1, "明细未附发票", "L1", "anomaly")

              if any(h["action"] == "reject" for h in hits):
                  conclusion, level = "anomaly", "L2"
              elif note:
                  # 有异常说明文字（即使规则 0 命中）说明单据存在人工复核点，禁止 L0 直通
                  conclusion, level = "anomaly", "L2"
              else:
                  hard = [h for h in hits if h["action"] == "anomaly"]
                  if not hard:
                      conclusion, level = "pass", "L0"
                  elif len(hard) >= 2:
                      conclusion, level = "anomaly", "L2"
                  else:
                      conclusion, level = "anomaly", "L1"

              # 只统计硬规则(action=anomaly)的超标比例，软提示(warn)不计入审批档位
              over_ratio = 0.0
              for h in hits:
                  if h["action"] != "anomaly":
                      continue
                  try:
                      a, t = float(h["actual"]), float(h["threshold"])
                      if t > 0 and a > t:
                          r = round((a - t) / t * 100, 1)
                          over_ratio = max(over_ratio, r)
                  except Exception:
                      pass

              has_reject = any(h["action"] == "reject" for h in hits)
              if conclusion == "pass":
                  user_conclusion = "✅ 审核结论：该报销申请可以通过审核（费用符合公司差旅制度标准），已自动转入正常审批流程。"
              elif has_reject:
                  user_conclusion = "❌ 审核结论：该报销申请不能通过审核，存在禁止报销项（见下方说明）。"
              elif level == "L2":
                  user_conclusion = "❌ 审核结论：该报销申请暂时不能直接通过审核，存在多项需处理的问题（见下方分析与建议）。"
              else:
                  user_conclusion = "⚠️ 审核结论：该报销申请暂时不能直接通过审核，需要先处理下方列出的问题并补充材料。"

              return {
                  "conclusion": conclusion,
                  "level": level,
                  "user_conclusion": user_conclusion,
                  "hit_count": len(hits),
                  "hits_json": json.dumps(hits, ensure_ascii=False),
                  "over_ratio": str(over_ratio),
                  "llm_calls": "0",
                  "note": note,
                  "header": header.get("name", ""),
              }
        code_language: python3
        outputs:
          conclusion:
            children:
            type: string
          header:
            children:
            type: string
          hit_count:
            children:
            type: number
          hits_json:
            children:
            type: string
          level:
